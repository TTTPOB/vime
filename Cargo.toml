[package]
name = "vime"
version = "0.1.0"
edition = "2021"
description = "Minimal Windows push-to-talk client for self-hosted streaming transcription"
license = "MIT"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "tokio", "x11"] }
fontdb = "0.23"
raw-window-handle = "0.6"
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
toml = "0.9"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = { version = "0.23", features = ["ring", "std", "tls12"], default-features = false }

[target.'cfg(windows)'.dependencies]
arboard = { version = "3.6", default-features = false }
cpal = "0.16"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell", "Win32_Graphics_Gdi"] }

[dev-dependencies]
iced_test = "0.14"
png = "0.18"
ttf-parser = "0.25"
tempfile = "3"
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[[bin]]
name = "vime"
path = "src/main.rs"

[[bin]]
name = "vime-mock"
path = "src/bin/vime-mock.rs"

[profile.release]
strip = true
lto = "thin"
