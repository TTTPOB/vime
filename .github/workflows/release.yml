name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo build --release --locked --bins
      - name: Package executables and documentation
        shell: pwsh
        run: ./scripts/package.ps1 -Version '${{ github.ref_name }}'
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          gh release create '${{ github.ref_name }}' @assets --verify-tag --title '${{ github.ref_name }}' --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
