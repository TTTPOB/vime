name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Install Linux Chinese fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install Windows Chinese fonts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $font = Get-WindowsCapability -Online -Name 'Language.Fonts.Hans*'
          if ($font.State -ne 'Installed') { Add-WindowsCapability -Online -Name $font.Name }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - name: Windows system input probe
        if: runner.os == 'Windows'
        run: cargo test --locked --test windows_api send_input_probe -- --ignored --nocapture
      - name: Windows overlay lifecycle probe
        if: runner.os == 'Windows'
        run: cargo test --locked --test overlay_windows -- --ignored --nocapture --test-threads=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-review-${{ runner.os }}
          path: target/overlay-screenshots/
          if-no-files-found: error
      - name: Build Windows executables
        if: runner.os == 'Windows'
        run: cargo build --release --locked --bins
      - name: Measure Windows overlay resources
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/overlay-metrics.ps1
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: vime-windows-x64
          path: |
            target/release/vime.exe
            target/release/vime-mock.exe
            target/overlay-metrics.json
          if-no-files-found: error
