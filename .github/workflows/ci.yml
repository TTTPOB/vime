name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install Linux Chinese fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install Windows Chinese fonts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $font = Get-WindowsCapability -Online -Name 'Language.Fonts.Hans*'
          if ($font.State -ne 'Installed') { Add-WindowsCapability -Online -Name $font.Name }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Windows system input probe
        if: runner.os == 'Windows'
        run: cargo test --locked --test windows_api send_input_probe -- --ignored --nocapture
      - run: cargo test --all-targets --locked
      - name: Windows overlay lifecycle probe
        if: runner.os == 'Windows'
        run: cargo test --locked --test overlay_windows -- --ignored --nocapture --test-threads=1
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('target/overlay-screenshots/index.html') != ''
        with:
          name: overlay-review-${{ runner.os }}
          path: target/overlay-screenshots/
          if-no-files-found: error
      - name: Build Windows executables
        if: runner.os == 'Windows'
        run: cargo build --release --locked --bins
      - name: Measure Windows overlay resources
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/overlay-metrics.ps1
      - name: Package Windows preview
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'vime').version
          ./scripts/package.ps1 -Version "v$version"
          Copy-Item target/overlay-metrics.json dist/overlay-metrics.json
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: vime-windows-x64
          path: dist/*
          if-no-files-found: error
